<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06080e">
  <meta name="description" content="Sign in to your LeakGrader account to access autonomous revenue audits, closer bots, and lead prospector.">
  <title>Log In — LeakGrader</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06080e;
      --card: #0f1523;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    img, svg {
      max-width: 100%;
      height: auto;
    }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-logo { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; font-weight: 800; font-size: 22px; margin-bottom: 12px; }
    .brand h1 { font-size: 24px; font-weight: 700; }
    .brand p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 16px !important; /* 16px prevents iOS Safari auto-zoom */
      min-height: 44px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus { border-color: var(--primary); }
    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      background: var(--primary);
      color: #06080e;
      border: none;
      font-weight: 700;
      font-size: 16px;
      min-height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; display: none; }
    .alert-danger { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--danger); }
    .alert-success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: var(--success); }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-links-row { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px; }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .auth-card { padding: 24px 18px; }
      .auth-links-row { flex-direction: column; gap: 10px; align-items: center; text-align: center; }
      .auth-links-row a { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">⚡</div>
      <h1>Welcome back</h1>
      <p>Sign in to your LeakGrader account</p>
    </div>

    <div id="alertBox" class="alert alert-danger"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Work Email</label>
        <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn">Sign In</button>
    </form>

    <div class="auth-links-row">
      <a href="/signup.html" style="color: var(--text-muted); text-decoration: none;">Need an account? <span style="color: var(--primary);">Sign up</span></a>
      <a href="#" id="forgotBtn" style="color: var(--text-muted); text-decoration: none;">Forgot password?</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const forgotBtn = document.getElementById('forgotBtn');

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-danger');
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.user) {
          if (data.session && data.session.csrf_token) {
            sessionStorage.setItem('csrf_token', data.session.csrf_token);
          }
          window.location.href = '/dashboard.html';
        } else {
          showAlert(data.error || 'Invalid email or password');
        }
      } catch (err) {
        showAlert('Network error occurred. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    forgotBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showAlert('Please enter your email above first, then click Forgot password.');
        return;
      }
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        showAlert(data.message || 'Password reset link sent.', true);
      } catch (err) {
        showAlert('Could not request password reset. Please try again.');
      }
    });
  </script>
</body>
</html>
