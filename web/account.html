<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06080e">
  <meta name="description" content="Manage your LeakGrader account settings and security credentials.">
  <title>Account Settings — LeakGrader</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06080e;
      --card: #0f1523;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    img, svg {
      max-width: 100%;
      height: auto;
    }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
    .brand-icon { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #0284c7, #38bdf8); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff; }
    .brand-title { font-size: 18px; font-weight: 700; }
    .btn-sm {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      transition: all 0.2s;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-sm:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--primary); }
    main { max-width: 800px; width: 100%; margin: 36px auto; padding: 0 24px; flex: 1; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 28px;
    }
    .card h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 16px !important; /* 16px prevents iOS auto-zoom */
      min-height: 44px;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    .btn {
      padding: 12px 20px;
      border-radius: 8px;
      background: var(--primary);
      color: #06080e;
      border: none;
      font-weight: 700;
      font-size: 15px;
      min-height: 44px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; }
    .alert { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
    .alert-danger { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--danger); }
    .alert-success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: var(--success); }
    .info-grid { display: grid; grid-template-columns: 140px 1fr; row-gap: 12px; font-size: 14px; }
    .info-label { color: var(--text-muted); font-weight: 600; }

    @media (max-width: 768px) {
      header { padding: 14px 16px; }
      main { margin: 20px auto; padding: 0 16px; }
      .card { padding: 20px 16px; }
      .info-grid { grid-template-columns: 1fr; row-gap: 6px; }
      .info-label { margin-top: 10px; font-size: 12px; }
      .info-label:first-child { margin-top: 0; }
      .btn { width: 100%; min-height: 48px; font-size: 16px; }
      .btn-sm { min-height: 44px; padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/dashboard.html" class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">LeakGrader</div>
    </a>
    <div style="display: flex; gap: 12px;">
      <a href="/dashboard.html" class="btn-sm">&larr; Back to Dashboard</a>
      <button id="logoutBtn" class="btn-sm">Logout</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h3>Profile & Workspace</h3>
      <div class="info-grid">
        <div class="info-label">Full Name:</div>
        <div id="uName">Loading...</div>
        <div class="info-label">Email:</div>
        <div id="uEmail">Loading...</div>
        <div class="info-label">Workspace:</div>
        <div id="uWorkspace">Loading...</div>
        <div class="info-label">Active Plan:</div>
        <div id="uPlan" style="color: var(--primary); font-weight: 700;">FREE</div>
      </div>
    </div>

    <div class="card">
      <h3>Change Password</h3>
      <div id="alertBox" class="alert alert-danger"></div>
      <form id="pwdForm">
        <div class="form-group">
          <label for="newPassword">New Password (8+ characters)</label>
          <input type="password" id="newPassword" class="form-control" placeholder="••••••••" minlength="8" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" minlength="8" required>
        </div>
        <button type="submit" id="savePwdBtn" class="btn">Update Password</button>
      </form>
    </div>
  </main>

  <script>
    async function loadAccount() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) {
          window.location.href = '/login.html';
          return;
        }
        const data = await res.json();
        const user = data.user;
        const ws = data.workspace || {};
        document.getElementById('uName').textContent = user.full_name || 'User';
        document.getElementById('uEmail').textContent = user.email;
        document.getElementById('uWorkspace').textContent = ws.name || 'Personal';
        document.getElementById('uPlan').textContent = (ws.plan || 'free').toUpperCase();
      } catch (e) {
        window.location.href = '/login.html';
      }
    }

    const form = document.getElementById('pwdForm');
    const alertBox = document.getElementById('alertBox');
    const saveBtn = document.getElementById('savePwdBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;

      if (p1 !== p2) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'block';
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Updating...';

      try {
        const csrfToken = sessionStorage.getItem('csrf_token') || '';
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken
          },
          body: JSON.stringify({ new_password: p1 })
        });
        const data = await res.json();
        if (res.ok) {
          alertBox.textContent = 'Password updated successfully!';
          alertBox.className = 'alert alert-success';
          alertBox.style.display = 'block';
          form.reset();
        } else {
          alertBox.textContent = data.error || 'Failed to update password';
          alertBox.className = 'alert alert-danger';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.textContent = 'Network error occurred.';
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'block';
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Update Password';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } catch (e) {}
      sessionStorage.removeItem('csrf_token');
      window.location.href = '/login.html';
    });

    loadAccount();
  </script>
</body>
</html>
